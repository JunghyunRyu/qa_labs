bug_type: FLOATING_POINT_COMPARISON
learning_objective: "부동소수점 비교의 위험성과 pytest.approx 사용법"
pytest_feature: pytest.approx

problems:
  - id: FP-E01
    difficulty: Easy
    title: "부동소수점 근사 비교 테스트"
    domain: common
    tags: ["부동소수점", "pytest.approx", "수치 비교", "경계값 분석"]

    function:
      name: is_close
      signature: "def is_close(a: float, b: float, tolerance: float = 1e-9) -> bool:"
      docstring: |
        두 부동소수점 수가 허용 오차 내에서 같은지 비교합니다.

        Args:
            a: 첫 번째 숫자
            b: 두 번째 숫자
            tolerance: 허용 오차 (기본값: 1e-9)

        Returns:
            두 수의 차이가 tolerance보다 작으면 True
      golden_logic: |
        return abs(a - b) < tolerance

    buggy_variants:
      - id: direct_comparison
        description: "부동소수점을 == 연산자로 직접 비교하여 0.1+0.2==0.3이 False가 됨"
        weight: 5
        logic: |
          return a == b
        detecting_inputs:
          - { a: 0.1, b: 0.1, expected: true }
          - { a: "0.1 + 0.2", b: 0.3, expected: true, note: "이 테스트로 버그 발견" }

      - id: wrong_tolerance_ignored
        description: "tolerance 파라미터를 무시하고 고정값 0.01 사용"
        weight: 4
        logic: |
          return abs(a - b) < 0.01
        detecting_inputs:
          - { a: 1.0, b: 1.000001, tolerance: 0.0000001, expected: false }

      - id: greater_instead_of_less
        description: "< 대신 > 사용하여 로직이 반대로 동작"
        weight: 3
        logic: |
          return abs(a - b) > tolerance
        detecting_inputs:
          - { a: 1.0, b: 1.0, expected: true }

      - id: missing_abs
        description: "abs() 없이 단순 차이 비교로 음수 케이스 실패"
        weight: 4
        logic: |
          return (a - b) < tolerance
        detecting_inputs:
          - { a: 1.0, b: 2.0, tolerance: 0.5, expected: false }

