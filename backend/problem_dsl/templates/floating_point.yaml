    description_md: |
      ## 문제 설명

      `calculate_compound_interest` 함수에 버그가 숨어 있을 수 있습니다.

      ### 함수 시그니처

      ```python
      def calculate_compound_interest(principal: float, rate: float, years: int) -> float:
      ```

      ### 복리 공식

      ```
      최종금액 = 원금 × (1 + 이율)^기간
      ```

      ### 주의사항
      - 결과는 소수점 2자리까지 반올림
      - 음수 원금, 음수 이율, 0 이하 기간은 ValueError 발생

      ### 예시
      - `calculate_compound_interest(1000, 0.1, 2)` → `1210.0`
      - `calculate_compound_interest(1000, 0.1, 3)` → `1331.0`
